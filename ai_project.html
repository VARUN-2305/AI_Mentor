<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Generator - CareerLeap AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #E0E0E0;
        }
        .aurora-text {
            background: linear-gradient(90deg, #C77DFF 0%, #E040FB 50%, #651FFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: aurora-flow 5s ease infinite;
        }
        @keyframes aurora-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .reveal-in {
            animation: revealIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes revealIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-background {
            position: fixed; top: 0; left: 0; height: 100vh; width: 100vw;
            background-image: linear-gradient(to right, #111 1px, transparent 1px), linear-gradient(to bottom, #111 1px, transparent 1px);
            background-size: 2rem 2rem; z-index: -1; filter: blur(1px);
        }
        .cta-button {
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            transition: all 0.3s ease;
        }
        .cta-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0px 10px 30px rgba(142, 45, 226, 0.3);
        }
        .project-card {
            background: radial-gradient(circle at 100% 0%, rgba(192, 132, 252, 0.1), transparent 40%),
                        radial-gradient(circle at 0% 100%, rgba(99, 102, 241, 0.1), transparent 40%),
                        #111827;
            border: 1px solid #1f2937;
            transition: all 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            border-color: #4f46e5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="antialiased">
    <div class="grid-background"></div>
    <div class="container mx-auto p-6 max-w-7xl">
        
        <!-- Intake Section -->
        <section id="intake-section" class="fade-in">
            <div class="w-full max-w-lg mx-auto">
                <div class="bg-[#111827] border border-[#1f2937] rounded-2xl p-8 shadow-2xl text-center">
                    <a href="dashboard.html" class="text-3xl font-bold text-white">CareerLeap <span class="aurora-text">AI</span></a>
                    <h1 class="text-4xl font-extrabold text-white mt-6">AI Project Generator</h1>
                    <p class="text-gray-400 mt-2">Get unique portfolio project ideas tailored to your skill gaps and career goals.</p>
                    
                    <form id="intake-form" class="text-left mt-8 space-y-6">
                        <div>
                            <label for="targetRole" class="block text-sm font-bold text-gray-300 mb-2">My Target Role is...</label>
                            <select id="targetRole" class="w-full bg-gray-800 border border-gray-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                                <option value="Software Engineer">Software Engineer</option>
                                <option value="Data Analyst">Data Analyst</option>
                                <option value="Data Scientist">Data Scientist</option>
                                <option value="Product Manager">Product Manager</option>
                                <option value="UX/UI Designer">UX/UI Designer</option>
                            </select>
                        </div>
                        <div>
                            <label for="focusSkills" class="block text-sm font-bold text-gray-300 mb-2">I want to practice... (Optional)</label>
                             <input type="text" id="focusSkills" class="w-full bg-gray-800 border border-gray-700 rounded-lg py-3 px-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., APIs, Data Visualization, React">
                        </div>
                        <button id="generate-btn" type="submit" class="w-full mt-6 cta-button text-white font-bold py-3 px-6 rounded-full text-lg">
                            Generate Project Ideas
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="hidden fade-in">
            <header class="text-center mb-12">
                <div class="flex justify-center items-center gap-6 mb-4">
                     <a href="dashboard.html" class="text-3xl font-bold text-white">CareerLeap <span class="aurora-text">AI</span></a>
                     <button id="start-over-btn" class="bg-gray-800 text-white font-semibold py-2 px-4 rounded-full hover:bg-gray-700 transition-colors text-sm border border-gray-600 flex items-center gap-2">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> New Ideas
                    </button>
                </div>
                <h1 class="text-5xl font-extrabold text-white">Your Elite Project Blueprints</h1>
                <p class="text-gray-400 mt-3 text-lg">AI-architected concepts for a future <strong id="display-role" class="aurora-text font-semibold"></strong></p>
            </header>
            
            <div id="results-loading" class="text-center py-12">
                <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-purple-500 mx-auto"></div>
                <p class="text-gray-400 mt-4 text-lg">Consulting our senior AI architect for industry-leading project concepts...</p>
            </div>

            <div id="results-content" class="hidden space-y-8 max-w-4xl mx-auto">
                <!-- Project cards will be injected here -->
            </div>
        </section>
    </div>

    <script>
        lucide.createIcons();

        const intakeSection = document.getElementById('intake-section');
        const resultsSection = document.getElementById('results-section');
        const intakeForm = document.getElementById('intake-form');
        const targetRoleSelect = document.getElementById('targetRole');
        const focusSkillsInput = document.getElementById('focusSkills');
        const displayRoleEl = document.getElementById('display-role');
        const loadingState = document.getElementById('results-loading');
        const resultsContent = document.getElementById('results-content');
        const startOverBtn = document.getElementById('start-over-btn');

        const API_KEY = "AIzaSyCWoDkjLyQQ7A46JdIEPWhN0mUiDsSpLZQ";

        intakeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const role = targetRoleSelect.value;
            const skills = focusSkillsInput.value;
            intakeSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            displayRoleEl.innerText = role;
            generateProjects(role, skills);
        });
        
        startOverBtn.addEventListener('click', () => {
            resultsSection.classList.add('hidden');
            intakeSection.classList.remove('hidden');
            resultsContent.classList.add('hidden').innerHTML = '';
            loadingState.classList.remove('hidden');
        });
        
        async function callGeminiAPI(prompt) {
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${API_KEY}`;
            const payload = { 
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            };
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) return { success: false, message: "The API Key may be invalid or the service is temporarily unavailable." };
                const result = await response.json();
                return { success: true, data: result.candidates?.[0]?.content?.parts?.[0]?.text };
            } catch (error) {
                return { success: false, message: "A network error occurred." };
            }
        }

        function parseJsonFromText(text) {
            if (!text) return null;
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}');
            if (jsonStart === -1 || jsonEnd === -1) return null;
            try { return JSON.parse(text.substring(jsonStart, jsonEnd + 1)); }
            catch (e) { return null; }
        }

        async function generateProjects(role, skills) {
            const skillsPrompt = skills ? `The user specifically wants to practice the following skills: ${skills}.` : '';
            const prompt = `
                Act as an elite FAANG hiring manager and tech lead. Your task is to generate 3 unique, impressive, and portfolio-worthy project ideas for a user targeting the role of "${role}". ${skillsPrompt}

                Your response must be a single, valid JSON object with a key "projects", which is an array of 3 project objects.
                For each project object, provide the following keys:
                - "project_title": A catchy, professional name for the project.
                - "project_concept": A concise, 1-2 sentence paragraph explaining the project's core idea.
                - "impact_statement": A short, powerful statement about why this project is impressive on a resume.
                - "core_features": An array of 3 to 5 strings, each describing a key feature the user must implement.
                - "tech_stack": An array of 3 to 5 strings listing recommended technologies (e.g., "React", "Node.js", "Firebase", "Chart.js").
                - "difficulty": A string, either "Beginner", "Intermediate", or "Advanced".

                IMPORTANT: Provide only the raw JSON object as your response. Do not include any extra text or markdown.
            `;
            const response = await callGeminiAPI(prompt);
            if (!response.success) {
                loadingState.innerHTML = `<p class="text-red-500 text-center font-semibold">${response.message}</p>`;
                return;
            }
            const data = parseJsonFromText(response.data);
            if (data && data.projects) {
                renderProjects(data.projects);
            } else {
                loadingState.innerHTML = `<p class="text-red-500 text-center font-semibold">The AI returned an unexpected response. Please try again.</p>`;
            }
        }

        function renderProjects(projects) {
            loadingState.classList.add('hidden');
            resultsContent.classList.remove('hidden');
            resultsContent.innerHTML = projects.map((project, index) => {
                const featuresHtml = project.core_features.map(feature => `
                    <li class="flex items-start">
                        <i data-lucide="check-circle-2" class="w-5 h-5 mr-3 text-green-500 flex-shrink-0 mt-1"></i>
                        <span>${feature}</span>
                    </li>
                `).join('');
                const stackHtml = project.tech_stack.map(tech => `<span class="bg-gray-700/50 text-indigo-300 text-xs font-medium mr-2 px-3 py-1 rounded-full border border-gray-600">${tech}</span>`).join('');

                let difficultyColor, difficultyIcon;
                switch(project.difficulty) {
                    case 'Intermediate':
                        difficultyColor = 'text-yellow-400';
                        difficultyIcon = 'bar-chart-2';
                        break;
                    case 'Advanced':
                        difficultyColor = 'text-red-400';
                        difficultyIcon = 'bar-chart';
                        break;
                    default: // Beginner
                        difficultyColor = 'text-green-400';
                        difficultyIcon = 'bar-chart-horizontal';
                        break;
                }
                
                return `
                <div class="project-card rounded-2xl p-8 reveal-in" style="animation-delay: ${index * 200}ms;">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                         <h2 class="text-3xl font-bold text-white">${project.project_title}</h2>
                         <div class="flex-shrink-0 flex items-center gap-2 text-sm font-bold ${difficultyColor} bg-gray-800/50 border border-gray-700/50 px-3 py-1 rounded-full">
                            <i data-lucide="${difficultyIcon}" class="w-4 h-4"></i>
                            <span>${project.difficulty}</span>
                         </div>
                    </div>
                    <p class="text-gray-400 mt-3 text-base">${project.project_concept}</p>
                    
                    <div class="mt-6 bg-black/20 border border-indigo-500/20 rounded-lg p-4">
                        <p class="font-semibold text-indigo-300 flex items-center"><i data-lucide="award" class="w-5 h-5 mr-2"></i>Portfolio Impact</p>
                        <p class="text-gray-300 mt-1 italic">"${project.impact_statement}"</p>
                    </div>

                    <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <h3 class="font-semibold text-lg text-white flex items-center"><i data-lucide="list-checks" class="w-5 h-5 mr-2 text-gray-400"></i>Core Features</h3>
                            <ul class="mt-3 space-y-3 text-gray-300">${featuresHtml}</ul>
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg text-white flex items-center"><i data-lucide="layers" class="w-5 h-5 mr-2 text-gray-400"></i>Tech Stack</h3>
                            <div class="mt-4 flex flex-wrap gap-2">${stackHtml}</div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
