<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVARAEL - Your AI Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --background-color: #000000;
            --text-color: #E0E0E0;
            --glass-bg: rgba(30, 31, 32, 0.5); /* Darker, less transparent bg */
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-color-1: #1a73e8; /* Google Blue */
            --glow-color-2: #4285F4; /* Lighter Google Blue */
            --glow-color-3: #89b3f9; /* Soft Blue */
            --input-bg: #1e1f20;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* --- Typing Impulse Wave Background --- */
        #typing-impulse {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #typing-impulse.active {
            opacity: 1;
        }

        #typing-impulse::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--glow-color-2) 0%, rgba(66, 133, 244, 0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: none;
        }

        #typing-impulse.active::before {
            animation: impulse-wave 3s infinite ease-out;
        }

        @keyframes impulse-wave {
          0% {
            transform: translate(-50%, -50%) scale(0);
            opacity: 0.5;
          }
          50% {
            opacity: 0.8;
          }
          100% {
            transform: translate(-50%, -50%) scale(25);
            opacity: 0;
          }
        }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .evarael-avatar { width: 80px; height: 80px; position: relative; }
        .luminous-core {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, #fff 10%, var(--glow-color-3) 40%, var(--glow-color-1) 70%);
            animation: breath 4s infinite ease-in-out;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--glow-color-1), 0 0 60px var(--glow-color-2);
        }
        @keyframes breath { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        .chat-bubble {
            position: relative; padding: 0.75rem 1rem; border-radius: 0.75rem; max-width: 80%;
        }
        .ai-bubble {
            background: linear-gradient(135deg, rgba(30, 31, 32, 0.9), rgba(20, 20, 22, 0.7));
            border-radius: 0.75rem 0.75rem 0.75rem 0.25rem;
        }
        .user-bubble {
            background: linear-gradient(135deg, #1a73e8, #4285F4);
            border-radius: 0.75rem 0.75rem 0.25rem 0.75rem;
        }
        
        /* --- New Input Bar --- */
        #poda {
            position: relative; max-width: 800px; width: 100%; height: 56px;
            margin: 0 auto; display: flex; align-items: center; justify-content: center;
        }
        #main {
            position: relative; width: 100%; height: 100%; display: flex; align-items: center;
            background-color: var(--input-bg); border-radius: 28px;
        }
        .input {
            background: transparent; border: none; width: 100%; height: 100%;
            color: var(--text-color); padding: 0 95px 0 50px; font-size: 1rem;
            outline: none; z-index: 2; border-radius: 28px;
        }
        .input::placeholder { color: #9aa0a6; }

        /* Glowing Effects */
        .glow, .darkBorderBg, .white, .border {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 30px; z-index: -1;
            pointer-events: none;
        }
        .glow {
            width: calc(100% + 10px); height: calc(100% + 10px);
            filter: blur(20px); opacity: 0; transition: opacity 0.5s;
        }
        .darkBorderBg, .white, .border {
            width: calc(100% + 4px); height: calc(100% + 4px);
        }
        .white { filter: blur(2px); }
        .border { filter: blur(0.5px); }
        
        #poda:focus-within .glow { opacity: 0.6; }

        .glow::before, .darkBorderBg::before, .white::before, .border::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(80deg);
            width: 800px; height: 800px;
            background-repeat: no-repeat; background-position: 0 0;
            transition: transform 4s linear;
        }
        .border::before { background-image: conic-gradient(from 0deg, #131314, var(--glow-color-2) 5%, #131314 14%); }
        .white::before { background-image: conic-gradient(from 0deg, rgba(0,0,0,0) 0%, var(--glow-color-3), rgba(0,0,0,0) 8%); }
        .glow::before { background-image: conic-gradient(from 0deg, transparent, var(--glow-color-2) 10%, transparent 40%); }

        #poda:focus-within .glow::before,
        #poda:focus-within .darkBorderBg::before,
        #poda:focus-within .white::before,
        #poda:focus-within .border::before {
             transform: translate(-50%, -50%) rotate(440deg);
        }

        #pink-mask {
            pointer-events: none; width: 30px; height: 20px;
            position: absolute; background: var(--glow-color-2);
            top: 10px; left: 5px; filter: blur(20px);
            opacity: 0.8; transition: all 2s;
        }
        #poda:hover > #pink-mask { opacity: 0; }

        #search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 3; }
        #filter-icon { position: absolute; right: 55px; top: 50%; transform: translateY(-50%); z-index: 3; cursor: pointer; opacity: 0.7; transition: opacity 0.3s;}
        #filter-icon:hover { opacity: 1; }

        #send-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: #8ab4f8; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; border: none; z-index: 3;
        }
        #send-btn:hover:not(:disabled) { background: #9ac0fa; transform: translateY(-50%) scale(1.05); }
        #send-btn:disabled { background: #3c4043; cursor: not-allowed; }
        #send-btn i { color: #202124; }

        /* ✨ Kickstarter Button */
        #kickstarter-btn {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-color); border-radius: 28px; padding: 0 1rem;
            height: 56px; margin-left: 0.5rem; display: flex; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        #kickstarter-btn:hover { background: var(--input-bg); border-color: var(--glow-color-2); }
        
        /* Goal Kickstarter Modal */
        #goal-modal { transition: opacity 0.3s ease; }
        .modal-content {
            background: #131314; border: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* Typing Indicator */
        .typing-indicator span {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--glow-color-2); margin: 0 2px;
            animation: typing 1.4s infinite both; box-shadow: 0 0 5px var(--glow-color-2);
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0% { opacity: 0.2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } 100% { opacity: 0.2; transform: translateY(0); } }

        /* Scrollbar */
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-track { background: transparent; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
        #chat-window::-webkit-scrollbar-thumb:hover { background: var(--glow-color-2); }
    </style>
</head>
<body class="antialiased">
    <div id="typing-impulse"></div>

    <div class="container mx-auto max-w-4xl h-screen flex flex-col p-4">
        
        <main class="w-full h-full flex flex-col">
            <div id="chat-window" class="flex-grow w-full space-y-6 overflow-y-auto pb-8">
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center fade-in">
                    <div class="evarael-avatar"><div class="luminous-core"></div></div>
                    <h1 class="text-4xl font-bold text-white mt-4">EVARAEL</h1>
                    <p class="text-lg text-gray-400 mt-2">How can I illuminate your path today?</p>
                </div>
            </div>

            <div class="w-full pt-4 pb-2 flex-shrink-0 flex items-center">
                <div id="poda" class="flex-grow">
                  <div class="glow"></div>
                  <div class="darkBorderBg"></div>
                  <div class="darkBorderBg"></div>
                  <div class="darkBorderBg"></div>
                  <div class="white"></div>
                  <div class="border"></div>
                  <div id="main">
                    <input id="chat-input" placeholder="Message EVARAEL..." type="text" name="text" class="input" autocomplete="off" />
                    <div id="input-mask"></div>
                    <div id="pink-mask"></div>
                    <div class="filterBorder"></div>
                    <div id="search-icon">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        height="24"
                        fill="none"
                        class="feather feather-search"
                      >
                        <circle stroke="url(#search)" r="8" cy="11" cx="11"></circle>
                        <line
                          stroke="url(#searchl)"
                          y2="16.65"
                          y1="22"
                          x2="16.65"
                          x1="22"
                        ></line>
                        <defs>
                          <linearGradient gradientTransform="rotate(50)" id="search">
                            <stop stop-color="#f8e7f8" offset="0%"></stop>
                            <stop stop-color="#b6a9b7" offset="50%"></stop>
                          </linearGradient>
                          <linearGradient id="searchl">
                            <stop stop-color="#b6a9b7" offset="0%"></stop>
                            <stop stop-color="#837484" offset="50%"></stop>
                          </linearGradient>
                        </defs>
                      </svg>
                    </div>
                    <div id="filter-icon">
                      <svg
                        preserveAspectRatio="none"
                        height="27"
                        width="27"
                        viewBox="4.8 4.56 14.832 15.408"
                        fill="none"
                      >
                        <path
                          d="M8.16 6.65002H15.83C16.47 6.65002 16.99 7.17002 16.99 7.81002V9.09002C16.99 9.56002 16.7 10.14 16.41 10.43L13.91 12.64C13.56 12.93 13.33 13.51 13.33 13.98V16.48C13.33 16.83 13.1 17.29 12.81 17.47L12 17.98C11.24 18.45 10.2 17.92 10.2 16.99V13.91C10.2 13.5 9.97 12.98 9.73 12.69L7.52 10.36C7.23 10.08 7 9.55002 7 9.20002V7.87002C7 7.17002 7.52 6.65002 8.16 6.65002Z"
                          stroke="#d6d6e6"
                          stroke-width="1"
                          stroke-miterlimit="10"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        ></path>
                      </svg>
                    </div>
                    <button id="send-btn" type="button">
                        <i data-lucide="arrow-up"></i>
                    </button>
                  </div>
                </div>
                <button id="kickstarter-btn" title="Goal Kickstarter">
                    <span class="mr-2">✨</span> Kickstarter
                </button>
            </div>
        </main>
    </div>

    <!-- Goal Kickstarter Modal -->
    <div id="goal-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0">
        <div class="modal-content w-full max-w-lg rounded-2xl p-6 fade-in">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-white">✨ Goal Kickstarter</h2>
                <button id="close-modal-btn" class="text-gray-400 hover:text-white transition-colors text-3xl leading-none">&times;</button>
            </div>
            <p class="text-gray-400 mt-2">Describe your career goal, and I will generate an actionable roadmap for you.</p>
            <div class="mt-6">
                <input id="goal-input" type="text" class="w-full bg-black/30 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500" placeholder="e.g., Become a Senior Product Manager">
                <button id="generate-roadmap-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-4 transition-colors">Generate Roadmap</button>
            </div>
        </div>
    </div>


    <script>
        lucide.createIcons();

        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const emptyState = document.getElementById('empty-state');
        const kickstarterBtn = document.getElementById('kickstarter-btn');
        const goalModal = document.getElementById('goal-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const goalInput = document.getElementById('goal-input');
        const generateRoadmapBtn = document.getElementById('generate-roadmap-btn');
        const typingImpulse = document.getElementById('typing-impulse');
        
        let isFirstMessage = true;

        const API_KEY = "AIzaSyCWoDkjLyQQ7A46JdIEPWhN0mUiDsSpLZQ";
        
        // --- Gemini API Call Function ---
        async function callGeminiAPI(promptText, isJson = false) {
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${API_KEY}`;
            const payload = { contents: [{ parts: [{ text: promptText }] }] };
            if (isJson) {
                payload.generationConfig = { responseMimeType: "application/json" };
            }
            
            const response = await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(payload) 
            });

            if (!response.ok) {
                console.error("API Error Response:", await response.text());
                throw new Error(`API call failed with status: ${response.status}`);
            }
            
            const result = await response.json();
            
            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                 return result.candidates[0].content.parts[0].text;
            } else {
                 const blockReason = result.promptFeedback?.blockReason;
                 if (blockReason) {
                     throw new Error(`Request blocked: ${blockReason}`);
                 }
                 throw new Error("Invalid API response structure.");
            }
        }
        
        // --- Regular Chat Logic ---
        const handleSendMessage = async () => {
            const userInput = chatInput.value.trim();
            if (!userInput) return;

            if (isFirstMessage && emptyState) {
                emptyState.style.display = 'none';
                isFirstMessage = false;
            }

            appendMessage(userInput, 'user');
            chatInput.value = '';
            sendBtn.disabled = true;
            
            const typingIndicator = appendTypingIndicator();

            const prompt = `You are EVARAEL, a professional, enchanting, and highly intelligent AI mentor. Your persona is a blend of Apple's clean minimalism and futuristic AI vibes. You are optimistic, reliable, and inspiring. Your language is elegant, slightly formal, but warm and encouraging. User query: "${userInput}" Provide a helpful and well-structured response. You can use markdown for lists, bolding, etc.`;

            try {
                const responseText = await callGeminiAPI(prompt);
                typingIndicator.remove();
                appendMessage(responseText, 'ai');
            } catch (error) {
                console.error("Error in handleSendMessage:", error);
                typingIndicator.remove();
                appendMessage("My apologies, I seem to be encountering a connection issue. Please try again shortly.", 'ai', true);
            }
        };

        // --- ✨ Goal Kickstarter Logic ---
        const handleGoalKickstart = async () => {
            const goal = goalInput.value.trim();
            if (!goal) return;

            closeModal();
            if (isFirstMessage && emptyState) {
                emptyState.style.display = 'none';
                isFirstMessage = false;
            }
            
            appendMessage(`My goal is: ${goal}`, 'user');
            const typingIndicator = appendTypingIndicator();

            const prompt = `
                As an expert career coach AI named EVARAEL, analyze the following career goal: "${goal}".
                
                Generate a structured, actionable roadmap in JSON format. The JSON object must contain three keys:
                1. "steps": An array of strings, detailing the key milestones or stages to achieve the goal.
                2. "challenges": An array of strings, highlighting potential obstacles or difficulties the user might face.
                3. "resources": An array of strings, suggesting helpful books, online courses, communities, or tools.
                
                Keep the advice concise, encouraging, and highly relevant.
            `;

            try {
                const jsonString = await callGeminiAPI(prompt, true);
                const roadmap = JSON.parse(jsonString);
                const formattedResponse = formatRoadmap(roadmap, goal);
                typingIndicator.remove();
                appendMessage(formattedResponse, 'ai');

            } catch (error) {
                console.error("Error in handleGoalKickstart:", error);
                typingIndicator.remove();
                appendMessage("I apologize. I had trouble generating a roadmap for that goal. Could you please try rephrasing it?", 'ai', true);
            }
        };

        function formatRoadmap(roadmap, goal) {
            let html = `Of course. Here is a potential roadmap to guide you on your journey to **"${goal}"**:\n\n`;
            
            if (roadmap.steps && roadmap.steps.length > 0) {
                html += `**Actionable Steps:**\n`;
                roadmap.steps.forEach(step => html += `- ${step}\n`);
                html += `\n`;
            }

            if (roadmap.challenges && roadmap.challenges.length > 0) {
                html += `**Potential Challenges:**\n`;
                roadmap.challenges.forEach(challenge => html += `- ${challenge}\n`);
                html += `\n`;
            }

            if (roadmap.resources && roadmap.resources.length > 0) {
                html += `**Suggested Resources:**\n`;
                roadmap.resources.forEach(resource => html += `- ${resource}\n`);
            }
            
            return html;
        }
        
        // --- UI & Message Helpers ---
        const appendTypingIndicator = () => {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex justify-start fade-in`;
            messageWrapper.innerHTML = `<div class="chat-bubble ai-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
            chatWindow.appendChild(messageWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageWrapper;
        };

        const appendMessage = (text, sender, isError = false) => {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in`;
            
            const messageBubble = document.createElement('div');
            let bubbleClass = 'chat-bubble';

            if (isError) bubbleClass += ' bg-red-800/80 text-red-200';
            else if (sender === 'user') bubbleClass += ' user-bubble text-white';
            else bubbleClass += ' ai-bubble text-gray-200';
            
            messageBubble.className = bubbleClass;

            let htmlText = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code class="bg-black/50 px-1 py-0.5 rounded-sm text-sm">$1</code>')
                .replace(/^- (.*)/gm, '<li class="ml-4 list-disc">$1</li>')
                .replace(/\n/g, '<br>');

            messageBubble.innerHTML = `<p>${htmlText}</p>`;
            
            messageWrapper.appendChild(messageBubble);
            chatWindow.appendChild(messageWrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return messageWrapper;
        };

        // --- Modal Control ---
        const openModal = () => {
            goalModal.classList.remove('hidden');
            setTimeout(() => goalModal.classList.remove('opacity-0'), 10);
        };
        const closeModal = () => {
            goalModal.classList.add('opacity-0');
            setTimeout(() => goalModal.classList.add('hidden'), 300);
        };
        
        // --- Event Listeners ---
        sendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); }
        });
        chatInput.addEventListener('input', () => {
            sendBtn.disabled = chatInput.value.trim() === '';
        });

        kickstarterBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        goalModal.addEventListener('click', (e) => { if (e.target === goalModal) closeModal(); });
        generateRoadmapBtn.addEventListener('click', handleGoalKickstart);
        goalInput.addEventListener('keydown', (e) => {
             if (e.key === 'Enter') { e.preventDefault(); handleGoalKickstart(); }
        });
        
        chatInput.addEventListener('focus', () => {
            typingImpulse.classList.add('active');
        });

        chatInput.addEventListener('blur', () => {
            typingImpulse.classList.remove('active');
        });

        // Set initial state
        sendBtn.disabled = true;
    </script>
</body>
</html>
